<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        background: #fffaf4;
        color: #6b5436;
        --boot-page-bg: #fffaf4;
        --boot-page-gradient: linear-gradient(180deg, #fff8ee 0%, #fffdf9 100%);
        --boot-page-glow: rgba(255, 199, 103, 0.16);
        --boot-brand-start: #ffd06d;
        --boot-brand-end: #ffaf29;
        --boot-brand-text: #523713;
        --boot-brand-shadow: rgba(255, 175, 41, 0.22);
        --boot-accent: #ffab25;
        --boot-text: #8c7458;
      }

      html[data-theme="dark"] {
        color-scheme: light;
        background: #f6f7f9;
        color: #23252c;
        --boot-page-bg: #f6f7f9;
        --boot-page-gradient: linear-gradient(180deg, #fafafc 0%, #f3f4f7 100%);
        --boot-page-glow: rgba(52, 54, 61, 0.04);
        --boot-brand-start: #4b4e58;
        --boot-brand-end: #34363d;
        --boot-brand-text: #fbfbfd;
        --boot-brand-shadow: rgba(35, 38, 45, 0.18);
        --boot-accent: #34363d;
        --boot-text: #5c616d;
      }

      html[data-theme="midnight"] {
        color-scheme: dark;
        background: #181818;
        color: #e6e6e6;
        --boot-page-bg: #181818;
        --boot-page-gradient: #181818;
        --boot-page-glow: rgba(255, 255, 255, 0.04);
        --boot-brand-start: #252526;
        --boot-brand-end: #1f1f1f;
        --boot-brand-text: #ffffff;
        --boot-brand-shadow: rgba(0, 0, 0, 0.4);
        --boot-accent: #d4d4d4;
        --boot-text: #9aa0a6;
      }

      html[data-theme="jade"] {
        color-scheme: light;
        background: #fffeee;
        color: #2f3f3e;
        --boot-page-bg: #fffeee;
        --boot-page-gradient: #fffeee;
        --boot-page-glow: transparent;
        --boot-brand-start: #1a8f92;
        --boot-brand-end: #00797c;
        --boot-brand-text: #fffeee;
        --boot-brand-shadow: rgba(0, 121, 124, 0.22);
        --boot-accent: #00797c;
        --boot-text: #5a6e6c;
      }

      html[data-theme="iris"] {
        color-scheme: light;
        background: #fffbea;
        color: #3a3a32;
        --boot-page-bg: #fffbea;
        --boot-page-gradient: #fffbea;
        --boot-page-glow: transparent;
        --boot-brand-start: #2478c9;
        --boot-brand-end: #0f64b5;
        --boot-brand-text: #fffbea;
        --boot-brand-shadow: rgba(15, 100, 181, 0.22);
        --boot-accent: #0f64b5;
        --boot-text: #6a6a5c;
      }

      html[data-theme="cyan"] {
        color-scheme: light;
        background: #ffffff;
        color: #3d4a52;
        --boot-page-bg: #ffffff;
        --boot-page-gradient: #ffffff;
        --boot-page-glow: transparent;
        --boot-brand-start: #05afb5;
        --boot-brand-end: #047b80;
        --boot-brand-text: #ffffff;
        --boot-brand-shadow: rgba(4, 123, 128, 0.22);
        --boot-accent: #05afb5;
        --boot-text: #5a6570;
      }

      html[data-theme="mauve"] {
        color-scheme: light;
        background: #fafbe6;
        color: #4a4258;
        --boot-page-bg: #fafbe6;
        --boot-page-gradient: #fafbe6;
        --boot-page-glow: transparent;
        --boot-brand-start: #b9a6ed;
        --boot-brand-end: #a48ce6;
        --boot-brand-text: #fafbe6;
        --boot-brand-shadow: rgba(164, 140, 230, 0.24);
        --boot-accent: #a48ce6;
        --boot-text: #6e6678;
      }

      html[data-theme="alum"] {
        color-scheme: light;
        background: #f5f4f7;
        color: #3a4542;
        --boot-page-bg: #f5f4f7;
        --boot-page-gradient: #f5f4f7;
        --boot-page-glow: transparent;
        --boot-brand-start: #3aad8c;
        --boot-brand-end: #2c9678;
        --boot-brand-text: #f5f4f7;
        --boot-brand-shadow: rgba(44, 150, 120, 0.22);
        --boot-accent: #2c9678;
        --boot-text: #5c6a66;
      }

      html[data-theme="mist"] {
        color-scheme: light;
        background: #e3e3e5;
        color: #3d4150;
        --boot-page-bg: #e3e3e5;
        --boot-page-gradient: #e3e3e5;
        --boot-page-glow: transparent;
        --boot-brand-start: #858cab;
        --boot-brand-end: #707899;
        --boot-brand-text: #e3e3e5;
        --boot-brand-shadow: rgba(112, 120, 153, 0.22);
        --boot-accent: #707899;
        --boot-text: #5c6070;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--boot-page-bg);
      }

      #app {
        min-height: 100vh;
      }

      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(circle at top, var(--boot-page-glow), transparent 42%),
          var(--boot-page-gradient);
        opacity: 1;
        transition: opacity 0.28s ease;
      }

      .app-boot.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .app-boot-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 88px;
        height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--boot-brand-start), var(--boot-brand-end));
        color: var(--boot-brand-text);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: 0 12px 28px var(--boot-brand-shadow);
      }

      .app-boot-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid color-mix(in srgb, var(--boot-accent) 22%, transparent);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: app-boot-spin 0.9s linear infinite;
      }

      .app-boot-text {
        font-size: 14px;
        color: var(--boot-text);
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("banana-web-theme");
          if (
            theme === "warm" ||
            theme === "jade" ||
            theme === "iris" ||
            theme === "cyan" ||
            theme === "mauve" ||
            theme === "alum" ||
            theme === "mist" ||
            theme === "dark" ||
            theme === "midnight"
          ) {
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.colorScheme = theme === "midnight" ? "dark" : "light";
          }
        } catch (error) {}
      })();
    </script>
    <link rel="preload" as="image" href="/homepage/canvas-result.webp" type="image/webp" fetchpriority="high" />
    <title>80AI - AI生图平台</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-boot" class="app-boot" role="status" aria-live="polite">
      <div class="app-boot-logo">80AI</div>
      <div class="app-boot-spinner" aria-hidden="true"></div>
      <div class="app-boot-text">页面加载中...</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
